<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Реєстрація — GoWay</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <a href="/" class="logo">✈️ Go<span>Way</span></a>
    <div class="nav-buttons">
      <a href="/login.html" class="btn-login">Увійти</a>
    </div>
  </header>

  <div class="page-wrapper">
    <a href="/" class="back-link">← На головну</a>
    <div class="card">
      <h2 style="margin-bottom:5px">Реєстрація</h2>
      <p style="color:#888;font-size:0.9em;margin-bottom:10px">Створіть акаунт і бронюйте тури!</p>
      <label>Ім'я</label>
      <input type="text" id="firstName" placeholder="Іван">
      <label>Прізвище</label>
      <input type="text" id="lastName" placeholder="Шевченко">
      <label>Email</label>
      <input type="email" id="email" placeholder="your@email.com">
      <label>Телефон</label>
      <input type="tel" id="phone" placeholder="+380XXXXXXXXX">
      <label>Пароль</label>
      <input type="password" id="password" placeholder="••••••••">
      <div style="margin-top:20px">
        <button class="btn-primary" onclick="register()">Зареєструватись</button>
      </div>
      <div class="error-msg" id="error"></div>
      <p style="text-align:center;margin-top:20px;color:#888;font-size:0.9em">
        Вже є акаунт? <a href="/login.html" style="color:#f72585;font-weight:600">Увійти</a>
      </p>
    </div>
  </div>

  <footer>© 2026 <span>GoWay Tours</span></footer>
  <script>
    async function register() {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          firstName: document.getElementById('firstName').value,
          lastName: document.getElementById('lastName').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (res.ok) { window.location = '/'; }
      else {
        const el = document.getElementById('error');
        el.textContent = data.error;
        el.style.display = 'block';
      }
    }
  </script>
</body>
</html>
